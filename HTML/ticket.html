<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join Coding Conf on October 26, 2026 in Papine, Kgn.">
  <title>Your Ticket | Coding Conf 2026</title>
  <link rel="icon" href="../assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/ticket.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Coding Conf home"><img src="../assets/images/logo-full.svg" alt="Coding Conf" width="210" height="30"></a>
    <nav aria-label="Main navigation"><a href="index.html">Event</a><a href="login.html">Register</a></nav>
  </header>
  <main id="main" class="confirmation" hidden>
    <section class="page-heading" aria-labelledby="success-title">
      <h1 id="success-title">Congrats, <span id="congrats-name" class="gradient"></span>!<br>Your ticket is ready.</h1>
      <p class="intro">Thanks for registering for Coding Conf.<br>Registration email: <span id="confirmation-email" class="accent"></span></p>
    </section>
    <section class="ticket" aria-label="Your Coding Conf ticket">
      <div class="ticket-content">
        <img class="ticket-logo" src="../assets/images/logo-full.svg" alt="Coding Conf" width="210" height="30">
        <p class="ticket-date">October 26, 2026 / Papine, Kgn</p>
        <div class="attendee"><img id="ticket-avatar" alt="Attendee profile photo" width="72" height="72"><div class="attendee-details"><h2 id="ticket-name"></h2><a id="ticket-github" target="_blank" rel="noopener noreferrer"><img src="../assets/images/icon-github.svg" alt="" width="20" height="20"><span id="github-handle"></span></a></div></div>
      </div>
      <p id="ticket-number" class="ticket-number"></p>
    </section>
    <div class="ticket-actions"><button id="print-ticket" class="button" type="button">Print My Ticket</button><a href="login.html">Register someone else</a></div>
  </main>
  <footer class="site-footer"><p>Coding Conf 2026 &bull; October 26 &bull; Papine, Kgn</p><p>A sample event website for CIT2011.</p></footer>
</body>
</html>
